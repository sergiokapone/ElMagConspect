<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Джерело з внутрішнім опором</title>
<style>
:root{--bg:#fbfbf8;--fg:#222;--panel:#fff;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--fg:#e6e6e6;--panel:#1f2228;}}
:root[data-theme="dark"]{--bg:#14161b;--fg:#e6e6e6;--panel:#1f2228;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,"Segoe UI",sans-serif}
#app{display:flex;height:100%}
#panel{width:290px;flex:none;box-sizing:border-box;padding:10px 12px;overflow:auto;background:var(--panel);line-height:1.4}
#stage{flex:1;position:relative;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
button{margin:3px 4px 2px 0;padding:4px 8px;border-radius:6px;border:1px solid #888;background:transparent;color:inherit;font-size:13px;cursor:pointer}
label{display:block;margin-top:8px}
input[type=range]{width:100%}
#ro{border-top:1px solid #8884;margin-top:10px;padding-top:6px;font-size:13px;line-height:1.55}
.note{font-size:12px;opacity:.75;margin-top:8px}
@media(max-width:800px){#app{flex-direction:column-reverse}#panel{width:auto;max-height:45%}}
</style>
<script src="assets/theme.js"></script>
</head>
<body>
<div id="app">
<div id="panel">
  <b>Джерело з внутрішнім опором</b>
  <label><span id="lE"></span><input type="range" id="E" min="1" max="24" step="0.5" value="12"></label>
  <label><span id="lr"></span><input type="range" id="r" min="0.05" max="5" step="0.05" value="0.5"></label>
  <label><span id="lR"></span><input type="range" id="x" min="-2" max="2" step="0.02" value="-0.3"></label>
  <div>
    <button id="pm">R = r (узгоджене)</button>
    <button id="kz">Коротке замикання</button>
    <button id="op">Розімкнено</button>
  </div>
  <div id="ro"></div>
  <div class="note">Модель: I = ε/(R+r); U = IR; P<sub>зовн</sub> = I²R; P<sub>повн</sub> = εI; η = R/(R+r).
  Максимум P<sub>зовн</sub> = ε²/(4r) досягається при R = r, і тоді η = 50&nbsp;%. На графіках пунктир показує поточне R.</div>
</div>
<div id="stage"><canvas id="c"></canvas></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>location.reload());
const BG=dark?'#14161b':'#fbfbf8',INK=dark?'#e6e6e6':'#222',AX=dark?'#aaa':'#555',GR=dark?'#ffffff1a':'#0000001a';
const C_U='#1f6fb5',C_I='#d4620f',C_P='#c0392b',C_E='#2e8b57';

function resize(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;g.setTransform(d,0,0,d,0,0);draw()}
window.addEventListener('resize',resize);

function par(){return{E:+$('E').value,r:+$('r').value,R:Math.pow(10,+$('x').value)}}
function calc(p){const I=p.E/(p.R+p.r);return{I,U:I*p.R,Pl:I*I*p.R,Pt:p.E*I,eta:p.R/(p.R+p.r),Ikz:p.E/p.r,Pmax:p.E*p.E/(4*p.r)}}
const fmt=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);

function setLabels(p){
  $('lE').textContent='ЕРС ε = '+p.E.toFixed(1)+' В';
  $('lr').textContent='Внутрішній опір r = '+p.r.toFixed(2)+' Ом';
  $('lR').textContent='Навантаження R = '+fmt(p.R)+' Ом (логарифмічна шкала)';
}
function setReadout(q){
  $('ro').innerHTML=
    'Струм I = '+fmt(q.I)+' А<br>'+
    'Напруга на навантаженні U = '+fmt(q.U)+' В<br>'+
    'Корисна потужність P<sub>зовн</sub> = '+fmt(q.Pl)+' Вт<br>'+
    'Повна потужність P<sub>повн</sub> = '+fmt(q.Pt)+' Вт<br>'+
    'ККД η = '+(100*q.eta).toFixed(1)+' %<br>'+
    'Струм короткого замикання = '+fmt(q.Ikz)+' А<br>'+
    'P<sub>max</sub> = ε²/(4r) = '+fmt(q.Pmax)+' Вт';
}

/* ---- графіки: по осі X — log10 R від 0,01 до 100 Ом ---- */
function plot(b,title,ymax,fn,color,unit){
  const x0=b.x+52,x1=b.x+b.w-12,y1=b.y+22,y0=b.y+b.h-22;
  const X=lr=>x0+(lr+2)/4*(x1-x0), Y=v=>y0-Math.max(0,Math.min(v,ymax))/ymax*(y0-y1);
  const R=+$('x').value, lr=R;
  g.font='13px system-ui,"Segoe UI",sans-serif';g.textBaseline='alphabetic';
  g.fillStyle=INK;g.textAlign='left';g.fillText(title,b.x+8,b.y+15);
  const v=fn(Math.pow(10,lr));
  g.fillStyle=color;g.textAlign='right';g.fillText(fmt(v)+' '+unit,x1,b.y+15);
  g.strokeStyle=GR;g.lineWidth=1;
  const tick=['0,01','0,1','1','10','100'];
  for(let k=0;k<5;k++){
    g.beginPath();g.moveTo(X(k-2),y1);g.lineTo(X(k-2),y0);g.stroke();
    g.fillStyle=AX;g.textAlign='center';g.fillText(tick[k],X(k-2),y0+15);
  }
  g.strokeStyle=AX;g.beginPath();g.moveTo(x0,y1);g.lineTo(x0,y0);g.lineTo(x1,y0);g.stroke();
  g.fillStyle=AX;g.textAlign='right';
  g.fillText(fmt(ymax),x0-6,y1+4);g.fillText('0',x0-6,y0+4);
  g.strokeStyle=color;g.lineWidth=2;g.beginPath();
  for(let k=0;k<=400;k++){const l=-2+4*k/400,yy=fn(Math.pow(10,l));k?g.lineTo(X(l),Y(yy)):g.moveTo(X(l),Y(yy));}
  g.stroke();
  g.strokeStyle=INK;g.lineWidth=1;g.setLineDash([4,3]);g.beginPath();g.moveTo(X(lr),y1);g.lineTo(X(lr),y0);g.stroke();g.setLineDash([]);
  g.fillStyle=color;g.beginPath();g.arc(X(lr),Y(v),4,0,2*Math.PI);g.fill();
}

/* ---- схема ---- */
function wire(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function mask(x,y,w,h){g.fillStyle=BG;g.fillRect(x,y,w,h)}
function zigzagV(x,y1,y2){ // вертикальний резистор
  g.beginPath();g.moveTo(x,y1);
  const n=6;for(let i=0;i<n;i++){const yy=y1+(y2-y1)*(i+0.5)/n;g.lineTo(x+(i%2?7:-7),yy)}
  g.lineTo(x,y2);g.stroke();
}
function battery(x,yc,sign){ // довга пластина — «+», угорі при sign>0
  const lw=g.lineWidth;g.lineWidth=2.5;
  const yl=yc-(sign>0?5:-5), ys=yc+(sign>0?5:-5);
  wire(x-12,yl,x+12,yl);wire(x-6,ys,x+6,ys);
  g.lineWidth=lw;
}

function drawCircuit(W,H,p,q){
  const L=W*0.10,Rr=W*0.36,T=H*0.20,B=H*0.80;
  g.strokeStyle=INK;g.lineWidth=2;
  wire(L,T,Rr,T);wire(L,B,Rr,B);wire(L,T,L,B);wire(Rr,T,Rr,B);
  // батарея (ЕРС) на лівій стороні
  const yb=T+(B-T)*0.36, yr=T+(B-T)*0.74, ym=(T+B)/2;
  mask(L-16,yb-16,32,32);battery(L,yb,1);
  // внутрішній опір r
  mask(L-9,yr-18,18,36);zigzagV(L,yr-14,yr+14);
  // зовнішнє навантаження R
  mask(Rr-9,ym-18,18,36);zigzagV(Rr,ym-14,ym+14);
  g.fillStyle=INK;g.font='15px system-ui,"Segoe UI",sans-serif';g.textAlign='right';
  g.fillText('ε',L-20,yb+5);
  g.fillText('r',L-20,yr+5);
  g.textAlign='left';g.fillText('R',Rr+14,ym+5);
  // стрілка струму на верхньому дроті
  const ax=(L+Rr)/2;
  g.strokeStyle=C_I;g.fillStyle=C_I;g.lineWidth=2.5;
  wire(ax-18,T,ax+18,T);
  g.beginPath();g.moveTo(ax+18,T);g.lineTo(ax+10,T-5);g.lineTo(ax+10,T+5);g.closePath();g.fill();
  g.font='14px system-ui,"Segoe UI",sans-serif';g.textAlign='center';
  g.fillText('I = '+fmt(q.I)+' А',ax,T-12);
  g.fillStyle=INK;g.font='12px system-ui,"Segoe UI",sans-serif';
  g.fillText('ε = '+p.E.toFixed(1)+' В',ax,B+22);
}

function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const p=par(),q=calc(p);
  setLabels(p);setReadout(q);
  drawCircuit(W*0.42,H,p,q);
  const px=W*0.46,pw=W-px-12,ph=(H-16)/4;
  plot({x:px,y:8,w:pw,h:ph},'Напруга U на навантаженні',p.E,R=>p.E*R/(R+p.r),C_U,'В');
  plot({x:px,y:8+ph,w:pw,h:ph},'Струм I',p.E/p.r,R=>p.E/(R+p.r),C_I,'А');
  plot({x:px,y:8+2*ph,w:pw,h:ph},'Корисна потужність P',p.E*p.E/(4*p.r)*1.05,R=>p.E*p.E*R/((R+p.r)*(R+p.r)),C_P,'Вт');
  plot({x:px,y:8+3*ph,w:pw,h:ph},'ККД η',1,R=>R/(R+p.r),C_E,'');
}

function setX(v){$('x').value=v;draw()}
$('pm').onclick=()=>setX(Math.log10(+$('r').value));
$('kz').onclick=()=>setX(-2);
$('op').onclick=()=>setX(2);
for(const id of ['E','r','x'])$(id).addEventListener('input',draw);

resize();
</script>
</body>
</html>
