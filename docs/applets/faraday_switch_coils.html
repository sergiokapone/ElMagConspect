<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дослід Фарадея: вмикання і вимикання струму</title>
<style>
  :root { --bg:#fbfbf8; --fg:#222; --panel:rgba(255,255,255,.9); }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b; --fg:#e6e6e6; --panel:rgba(35,38,44,.9);}}
:root[data-theme="dark"]{--bg:#14161b; --fg:#e6e6e6; --panel:rgba(35,38,44,.9);}
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font-family: system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #panel { position:absolute; top:10px; left:10px; background:var(--panel); padding:10px 12px;
           border-radius:10px; font-size:14px; line-height:1.45; width:300px; backdrop-filter:blur(4px); }
  #panel button { margin:2px 4px 2px 0; padding:4px 10px; border-radius:6px; border:1px solid #888;
                  background:transparent; color:inherit; cursor:pointer; font-size:13px; }
  #panel label { display:block; margin-top:5px; }
  #panel input[type=range] { width:100%; }
  #readout { margin-top:8px; border-top:1px solid #8884; padding-top:6px; font-size:13px; line-height:1.5; }
  #hint { position:absolute; bottom:6px; left:12px; right:12px; font-size:12px; opacity:.7; }
@media (max-width:700px){
  /* Телефон: панель керування над полотном, а не поверх нього */
  html,body{height:auto;overflow:auto}
  body{display:flex;flex-direction:column}
  canvas{order:2;flex:none;height:62vh;min-height:300px}
  #panel{position:static;order:1;width:auto;max-width:none;margin:8px}
  #hint{position:static;order:3;margin:8px 12px 12px}
}
</style>
<script src="assets/theme.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div>
    <button id="toggle">Замкнути ключ</button>
    <button id="reset">Скинути</button>
    <button id="play">Пауза</button>
  </div>
  <label>Стала часу під час вмикання τ_вкл: <span id="tonVal"></span>
    <input type="range" id="tau_on" min="0.1" max="2" step="0.05" value="0.6"></label>
  <label>Стала часу під час вимикання τ_вим: <span id="toffVal"></span>
    <input type="range" id="tau_off" min="0.03" max="0.5" step="0.01" value="0.08"></label>
  <label>Взаємна індуктивність M: <span id="mVal"></span>
    <input type="range" id="M" min="0.2" max="3" step="0.1" value="1"></label>
  <label>Швидкість часу: <span id="tsVal"></span>
    <input type="range" id="ts" min="0.25" max="2" step="0.05" value="0.6"></label>
  <div id="readout"></div>
</div>

<div id="hint">
  Клацніть на важіль ключа або натисніть кнопку. При вмиканні струм у первинній котушці зростає, і потік через вторинну
  котушку збільшується. При вимиканні струм спадає, і потік зменшується. ЕРС у вторинній котушці протилежна за знаком
  у двох випадках. Вторинна котушка приєднана до гальванометра.
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>location.reload());

const COL = {
  prim: dark ? '#ffb070' : '#c2561c',
  sec:  dark ? '#7fd3ff' : '#1f6fb5',
  wire: dark ? '#bbb' : '#444',
  core: dark ? '#4a4f5a' : '#9aa0aa',
  axis: dark ? '#aaa' : '#555',
  field: dark ? '255,200,120' : '230,120,20',
  pos:  '#d62728'
};

const WIN = 10;        // вікно графіка, с
const EMAX = 12;       // межа ε₂ на графіку

let W = 0, H = 0, cy = 0, xBat = 0, cyT = 0, xSw1 = 0, xSw2 = 0;
let xPl = 0, xPr = 0, xSl = 0, xSr = 0, gx = 0, gr = 40;
let plotX0 = 0, plotY0 = 0, plotY1 = 0;

let sw = false;        // ключ замкнено
let I = 0;             // відносний струм у первинній котушці, 0…1
let e2 = 0;            // ЕРС у вторинній котушці
let tAbs = 0, last = performance.now();
let running = true;
let hist = [];

const el = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth;
  H = cv.clientHeight;
  cv.width = Math.round(W * d);
  cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  cy = H * 0.34;
  cyT = cy - 130;
  xBat = W * 0.1;
  xSw1 = W * 0.18;
  xSw2 = W * 0.26;
  xPl = W * 0.34;
  xPr = xPl + 54;
  xSl = W * 0.5;
  xSr = xSl + 54;
  gx = W * 0.8;
  plotX0 = Math.max(330, W * 0.1);
  plotY0 = H * 0.68;
  plotY1 = H - 30;
}

function resetSim() {
  sw = false;
  I = 0;
  e2 = 0;
  tAbs = 0;
  hist = [];
}

/* ---------- фізика ---------- */
// Коло RL: dI/dt = (I_target − I)/τ, I_target = 1 при замкненому ключі, 0 — при розімкненому
// Вторинна ЕРС: ε₂ = −M·dI/dt = M·(I − I_target)/τ

function update(dt) {
  const target = sw ? 1 : 0;
  const tau = sw ? Number(el('tau_on').value) : Number(el('tau_off').value);
  if (dt > 0) I = target + (I - target) * Math.exp(-dt / tau);
  const M = Number(el('M').value);
  e2 = M * (I - target) / tau;

  if (dt > 0) {
    hist.push({ t: tAbs, I, e: e2 });
    while (hist.length && hist[0].t < tAbs - WIN) hist.shift();
  }
}

/* ---------- малювання ---------- */

function drawCoilLoops(x0, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;
  for (let i = 0; i < 7; i++) {
    ctx.beginPath();
    ctx.ellipse(x0 + i * 9, cy, 3.5, 55, 0, 0, 2 * Math.PI);
    ctx.stroke();
  }
}

function drawCircuit() {
  ctx.strokeStyle = COL.wire; ctx.lineWidth = 1.5;

  // батарея
  ctx.beginPath();
  ctx.moveTo(xBat, cy - 20); ctx.lineTo(xBat, cyT);
  ctx.moveTo(xBat, cy + 20); ctx.lineTo(xBat, cy + 110); ctx.lineTo(xPr, cy + 110); ctx.lineTo(xPr, cy + 55);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(xBat - 15, cy - 8); ctx.lineTo(xBat + 15, cy - 8); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xBat - 8, cy + 8); ctx.lineTo(xBat + 8, cy + 8); ctx.stroke();
  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('ЕРС', xBat, cy + 30);

  // верхній провід: батарея → ключ → первинна котушка
  ctx.strokeStyle = COL.wire; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(xBat, cyT); ctx.lineTo(xSw1, cyT);
  ctx.moveTo(xSw2, cyT); ctx.lineTo(xPl, cyT); ctx.lineTo(xPl, cy - 55);
  ctx.stroke();

  // ключ (важіль)
  ctx.beginPath(); ctx.arc(xSw1, cyT, 4, 0, 2 * Math.PI); ctx.fillStyle = COL.wire; ctx.fill();
  ctx.beginPath(); ctx.arc(xSw2, cyT, 3, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = sw ? COL.prim : COL.wire; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(xSw1, cyT);
  if (sw) ctx.lineTo(xSw2, cyT);
  else ctx.lineTo(xSw2 - 4, cyT - 26);
  ctx.stroke();
  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(sw ? 'замкнено' : 'розімкнено', (xSw1 + xSw2) / 2, cyT - 34);

  // вторинна котушка → гальванометр
  ctx.strokeStyle = COL.wire; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(xSl, cy - 55); ctx.lineTo(xSl, cyT); ctx.lineTo(gx, cyT); ctx.lineTo(gx, cy - gr);
  ctx.moveTo(xSr, cy + 55); ctx.lineTo(xSr, cy + 120); ctx.lineTo(gx, cy + 120); ctx.lineTo(gx, cy + gr);
  ctx.stroke();
}

function drawCores() {
  // залізне осердя
  ctx.fillStyle = COL.core;
  ctx.fillRect(xPl - 12, cy - 8, xSr - xPl + 24, 16);
}

function drawFieldLines() {
  // магнітне поле первинної котушки (інтенсивність ∝ I)
  if (I < 0.01) return;
  ctx.lineWidth = 1.5;
  for (const dy of [-30, -18, 18, 30]) {
    ctx.strokeStyle = `rgba(${COL.field},${(0.15 + 0.6 * I).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(xPl - 35, cy + dy * 0.8);
    ctx.lineTo(xPr + 35, cy + dy * 0.8);
    ctx.stroke();
  }
  // свічення всередині первинної котушки
  ctx.fillStyle = `rgba(${COL.field},${(0.25 * I).toFixed(3)})`;
  ctx.fillRect(xPl, cy - 50, xPr - xPl, 100);
}

function drawCoils() {
  drawCoilLoops(xPl, COL.prim);
  drawCoilLoops(xSl, COL.sec);
  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('первинна', (xPl + xPr) / 2, cy - 66);
  ctx.fillText('вторинна', (xSl + xSr) / 2, cy - 66);
}

function drawGalvanometer() {
  ctx.beginPath(); ctx.arc(gx, cy, gr, 0, 2 * Math.PI);
  ctx.fillStyle = dark ? '#1d2128' : '#fff'; ctx.fill();
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.5; ctx.stroke();
  const defl = clamp(e2 / 6, -1, 1) * 0.8;
  ctx.strokeStyle = e2 >= 0 ? COL.sec : COL.pos; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(gx, cy);
  ctx.lineTo(gx + (gr - 7) * Math.sin(defl), cy - (gr - 7) * Math.cos(defl));
  ctx.stroke();
  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('гальванометр', gx, cy + gr + 18);
}

function drawGraph() {
  const x0 = plotX0, x1 = W - 30, y0 = plotY0, y1 = plotY1;
  const yZ = (y0 + y1) / 2, half = (y1 - y0) / 2 - 8;
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x0, yZ); ctx.lineTo(x1, yZ); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('I(t) — помаранчева, ε₂(t) — синя (масштаб ε₂ обмежено); час →', x0 + 6, y0 + 12);

  if (hist.length < 2) return;
  const tStart = tAbs - WIN;
  const xOf = tt => x0 + (tt - tStart) / WIN * (x1 - x0);

  ctx.strokeStyle = COL.prim; ctx.lineWidth = 2;
  ctx.beginPath();
  hist.forEach((h, i) => {
    const px = xOf(h.t), py = y1 - 8 - h.I * (y1 - y0 - 16);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();

  ctx.strokeStyle = COL.sec; ctx.lineWidth = 2;
  ctx.beginPath();
  hist.forEach((h, i) => {
    const px = xOf(h.t), py = yZ - clamp(h.e, -EMAX, EMAX) / EMAX * half;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawCores();
  drawFieldLines();
  drawCoils();
  drawCircuit();
  drawGalvanometer();
  drawGraph();
}

/* ---------- текст ---------- */

function readout() {
  const target = sw ? 1 : 0;
  let lt;
  if (Math.abs(I - target) < 0.01) {
    lt = 'Струм у первинній котушці сталий, потік не змінюється, ε₂ ≈ 0.';
  } else if (sw) {
    lt = 'Ключ замкнено: струм <b>зростає</b>, магнітний потік у вторинній котушці <b>зростає</b>. ε₂ від’ємна (правило Ленца).';
  } else {
    lt = 'Ключ розімкнено: струм <b>спадає</b>, потік <b>спадає</b>. ε₂ додатна: знак протилежний до вмикання.';
  }
  el('readout').innerHTML =
    `Ключ: ${sw ? 'замкнено' : 'розімкнено'}<br>` +
    `I = ${I.toFixed(2)} від сталого значення<br>` +
    `ε₂ = −M·dI/dt = ${e2.toFixed(2)} (у.о.)<br>${lt}`;
}

/* ---------- цикл ---------- */

function frame(now) {
  const dt = running ? Math.min(0.05, (now - last) / 1000) * Number(el('ts').value) : 0;
  last = now;
  if (running) tAbs += dt;
  el('tonVal').textContent = Number(el('tau_on').value).toFixed(2) + ' с';
  el('toffVal').textContent = Number(el('tau_off').value).toFixed(2) + ' с';
  el('mVal').textContent = Number(el('M').value).toFixed(1);
  el('tsVal').textContent = Number(el('ts').value).toFixed(2) + '×';
  update(dt);
  draw();
  readout();
  requestAnimationFrame(frame);
}

/* ---------- керування ---------- */

function toggleSwitch() {
  sw = !sw;
  el('toggle').textContent = sw ? 'Розімкнути ключ' : 'Замкнути ключ';
}

el('toggle').onclick = toggleSwitch;
el('reset').onclick = () => {
  resetSim();
  el('toggle').textContent = 'Замкнути ключ';
};
el('play').onclick = () => {
  running = !running;
  el('play').textContent = running ? 'Пауза' : 'Продовжити';
};

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.abs(x - (xSw1 + xSw2) / 2) < 40 && Math.abs(y - cyT) < 40) toggleSwitch();
});

window.addEventListener('resize', resize);
resize();
resetSim();
requestAnimationFrame(frame);
</script>
<script src="assets/panel-toggle.js"></script>
</body>
</html>
