<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дослід Фарадея: рух магніту або котушки</title>
<style>
  :root { --bg:#fbfbf8; --fg:#222; --panel:rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --fg:#e6e6e6; --panel:rgba(35,38,44,.9); }
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font-family: system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #panel { position:absolute; top:10px; left:10px; background:var(--panel); padding:10px 12px;
           border-radius:10px; font-size:14px; line-height:1.45; width:300px; backdrop-filter:blur(4px); }
  #panel button { margin:2px 4px 2px 0; padding:4px 10px; border-radius:6px; border:1px solid #888;
                  background:transparent; color:inherit; cursor:pointer; font-size:13px; }
  #panel button.sel { background:#888; color:#fff; }
  #panel label { display:block; margin-top:5px; }
  #panel .chk { display:block; margin-top:5px; }
  #panel input[type=range] { width:100%; }
  #readout { margin-top:8px; border-top:1px solid #8884; padding-top:6px; font-size:13px; line-height:1.5; }
  #hint { position:absolute; bottom:6px; left:12px; right:12px; font-size:12px; opacity:.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div><b>Що рухаємо:</b></div>
  <button id="modeMagnet" class="sel">Магніт</button>
  <button id="modeCoil">Котушку</button>
  <button id="flip">Перевернути магніт</button>

  <div style="margin-top:6px">
    <button id="play">Пауза</button>
    <button id="reset">Скинути</button>
  </div>

  <label class="chk"><input type="checkbox" id="auto"> автоматичні коливання</label>
  <label>Амплітуда коливань: <span id="aVal"></span>
    <input type="range" id="A" min="40" max="250" step="5" value="140"></label>
  <label>Частота коливань ω: <span id="wVal"></span>
    <input type="range" id="om" min="0.5" max="4" step="0.1" value="1.6"></label>
  <label>Кількість витків N: <span id="nVal"></span>
    <input type="range" id="N" min="20" max="300" step="10" value="100"></label>

  <div id="readout"></div>
</div>

<div id="hint">
  Перетягуйте магніт (або котушку) мишею. Магніт можна провести крізь котушку: ЕРС змінює знак, коли потік
  починає зменшуватися. Стрілка гальванометра відхиляється вправо при ε &gt; 0 і вліво при ε &lt; 0.
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

const COL = {
  coil: dark ? '#e6a86a' : '#a0522d',
  wire: dark ? '#bbb' : '#444',
  N:    '#d62728',
  S:    '#1f5fbf',
  axis: dark ? '#aaa' : '#555',
  eps:  dark ? '#ffd166' : '#b35900',
  grid: dark ? '#444' : '#ddd'
};

const SH = 70;                    // масштаб довжини, px
const S3 = Math.pow(SH, 3);       // Φ(d) = pol·S³/(d²+S²)^{3/2}, Φ(0) = 1
const NL = 8;                     // кількість видимих витків
const WIN = 8;                    // вікно графіка, с
const EMAX = 4;                   // межа ε на графіку

let W = 0, H = 0, cy = 0, gx = 0, gyG = 0, plotX0 = 0, plotY0 = 0, plotY1 = 0;
let xM = 0, xC = 0, pol = 1;
let mode = 'magnet';
let drag = null;
let running = true;
let tAbs = 0, last = performance.now();
let autoC = 0;
let dPrev = 0, vS = 0, eps = 0, dphi = 0;
let hist = [];

const el = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth;
  H = cv.clientHeight;
  cv.width = Math.round(W * d);
  cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  cy = H * 0.3;
  gx = W * 0.8;
  gyG = cy + 95;
  plotX0 = Math.max(330, W * 0.1);
  plotY0 = H * 0.7;
  plotY1 = H - 30;
}

function resetSim() {
  xC = W * 0.6;
  xM = W * 0.25;
  pol = 1;
  tAbs = 0;
  vS = 0;
  dPrev = xM - xC;
  hist = [];
}

/* ---------- фізика ---------- */
// Φ(d) = pol·S³/(d²+S²)^{3/2}, d = x_магніту − x_котушки
// ε = −N·dΦ/dt = −N·(dΦ/dd)·v, v — швидкість відносного руху

function update(dt) {
  if (el('auto').checked && dt > 0) {
    const off = Number(el('A').value) * Math.sin(Number(el('om').value) * tAbs);
    if (mode === 'magnet') xM = autoC + off; else xC = autoC + off;
  }
  const d = xM - xC;
  if (dt > 0) vS = 0.6 * vS + 0.4 * ((d - dPrev) / dt);
  dPrev = d;

  dphi = pol * (-3 * S3 * d) / Math.pow(d * d + SH * SH, 2.5);   // dΦ/dd
  const Nn = Number(el('N').value) / 100;
  eps = -Nn * dphi * vS;

  if (dt > 0) {
    hist.push({ t: tAbs, e: eps });
    while (hist.length && hist[0].t < tAbs - WIN) hist.shift();
  }
}

/* ---------- малювання ---------- */

function drawCoil() {
  ctx.strokeStyle = COL.coil; ctx.lineWidth = 2.5;
  const x0 = xC - (NL - 1) / 2 * 7, x1 = xC + (NL - 1) / 2 * 7;
  for (let i = 0; i < NL; i++) {
    const x = xC + (i - (NL - 1) / 2) * 7;
    ctx.beginPath();
    ctx.ellipse(x, cy, 3.5, 42, 0, 0, 2 * Math.PI);
    ctx.stroke();
  }
  // виводи до гальванометра
  ctx.strokeStyle = COL.wire; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x0, cy + 42); ctx.lineTo(x0, cy + 120); ctx.lineTo(gx - 45, cy + 120); ctx.lineTo(gx - 45, gyG);
  ctx.moveTo(x1, cy + 42); ctx.lineTo(x1, cy + 150); ctx.lineTo(gx + 45, cy + 150); ctx.lineTo(gx + 45, gyG);
  ctx.stroke();

  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('котушка', xC, cy - 52);
}

function drawMagnet() {
  const w = 110, h = 26;
  const x0 = xM - w / 2, y0 = cy - h / 2;
  const leftCol = pol > 0 ? COL.S : COL.N;
  const rightCol = pol > 0 ? COL.N : COL.S;
  ctx.fillStyle = leftCol; ctx.fillRect(x0, y0, w / 2, h);
  ctx.fillStyle = rightCol; ctx.fillRect(xM, y0, w / 2, h);
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, w, h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(pol > 0 ? 'S' : 'N', xM - w / 4, cy);
  ctx.fillText(pol > 0 ? 'N' : 'S', xM + w / 4, cy);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('магніт', xM, cy - 22);
}

function drawGalvanometer() {
  const r = 45;
  ctx.beginPath(); ctx.arc(gx, gyG, r, 0, 2 * Math.PI);
  ctx.fillStyle = dark ? '#1d2128' : '#fff'; ctx.fill();
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.5; ctx.stroke();

  const defl = clamp(eps / 3, -1, 1) * 0.8;
  ctx.strokeStyle = eps >= 0 ? COL.eps : COL.N; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(gx, gyG);
  ctx.lineTo(gx + (r - 8) * Math.sin(defl), gyG - (r - 8) * Math.cos(defl));
  ctx.stroke();

  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('гальванометр', gx, gyG + r + 16);
  ctx.fillText('0', gx, gyG - r + 14);
}

function drawGraph() {
  const x0 = plotX0, x1 = W - 30, y0 = plotY0, y1 = plotY1;
  const yZ = (y0 + y1) / 2, half = (y1 - y0) / 2 - 6;
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x0, yZ); ctx.lineTo(x1, yZ); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = COL.axis; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('ε(t), у.о.; час →', x0 + 6, y0 + 12);

  if (hist.length < 2) return;
  const tStart = tAbs - WIN;
  ctx.strokeStyle = COL.eps; ctx.lineWidth = 2;
  ctx.beginPath();
  hist.forEach((h, i) => {
    const px = x0 + (h.t - tStart) / WIN * (x1 - x0);
    const py = yZ - clamp(h.e, -EMAX, EMAX) / EMAX * half;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawCoil();
  drawMagnet();
  drawGalvanometer();
  drawGraph();
}

/* ---------- текст ---------- */

function readout() {
  const d = xM - xC;
  let lt;
  if (Math.abs(vS) < 2) {
    lt = 'Рух відсутній: потік не змінюється, ε ≈ 0, струму немає.';
  } else if (dphi * vS > 0) {
    lt = 'Потік через котушку <b>зростає</b>. Індукційний струм створює поле, що протидіє цьому зростанню (правило Ленца).';
  } else {
    lt = 'Потік через котушку <b>зменшується</b>. Індукційний струм підтримує його, щоб протидіяти спаду.';
  }
  el('readout').innerHTML =
    `d = ${d.toFixed(0)} px, відносна швидкість v = ${vS.toFixed(0)} px/s<br>` +
    `ε = −N·dΦ/dt = ${eps.toFixed(2)} (у.о.)<br>${lt}`;
}

/* ---------- цикл ---------- */

function frame(now) {
  const dt = running ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (running) tAbs += dt;
  el('aVal').textContent = el('A').value + ' px';
  el('wVal').textContent = Number(el('om').value).toFixed(1) + ' рад/с';
  el('nVal').textContent = el('N').value;
  update(dt);
  draw();
  readout();
  requestAnimationFrame(frame);
}

/* ---------- керування ---------- */

function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cv.addEventListener('pointerdown', e => {
  if (el('auto').checked) return;
  const p = pos(e);
  if (mode === 'magnet' && Math.abs(p.x - xM) < 70 && Math.abs(p.y - cy) < 30) drag = 'magnet';
  else if (mode === 'coil' && Math.abs(p.x - xC) < 40 && Math.abs(p.y - cy) < 60) drag = 'coil';
  if (drag) cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pos(e);
  if (drag === 'magnet') xM = clamp(p.x, 20, W - 20);
  else xC = clamp(p.x, 20, W - 20);
});

cv.addEventListener('pointerup', () => { drag = null; });

function setMode(m) {
  mode = m;
  el('modeMagnet').classList.toggle('sel', m === 'magnet');
  el('modeCoil').classList.toggle('sel', m === 'coil');
  drag = null;
  if (el('auto').checked) autoC = m === 'magnet' ? xM : xC;
}

el('modeMagnet').onclick = () => setMode('magnet');
el('modeCoil').onclick = () => setMode('coil');
el('flip').onclick = () => { pol = -pol; };
el('play').onclick = () => {
  running = !running;
  el('play').textContent = running ? 'Пауза' : 'Продовжити';
};
el('reset').onclick = () => resetSim();
el('auto').onchange = () => {
  if (el('auto').checked) {
    autoC = mode === 'magnet' ? xM : xC;
    tAbs = 0;
  }
};

window.addEventListener('resize', resize);
resize();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
