<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Силові лінії та еквіпотенціалі системи точкових зарядів</title>
<style>
  :root { --bg:#fbfbf8; --fg:#222; --panel:rgba(255,255,255,.85); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e6e6e6; --panel:rgba(35,38,44,.85); }
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font-family: system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  #panel { position:absolute; top:10px; left:10px; background:var(--panel); padding:10px 12px;
           border-radius:10px; font-size:14px; line-height:1.5; max-width:270px; backdrop-filter:blur(4px); }
  #panel button { margin:2px 4px 2px 0; padding:4px 10px; border-radius:6px; border:1px solid #888;
                  background:transparent; color:inherit; cursor:pointer; font-size:13px; }
  #panel button.sel { background:#888; color:#fff; }
  #panel label { display:block; margin-top:4px; }
  #hint { position:absolute; bottom:10px; left:10px; right:10px; font-size:13px; opacity:.75; }
  #info { margin-top:6px; opacity:.8; font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="panel">
    <div><b>Додати заряд:</b></div>
    <button id="addPos" class="sel">+ додатний</button>
    <button id="addNeg">− від'ємний</button>

    <label>Величина нового заряду: <span id="magVal">1.0</span>
      <input type="range" id="newMag" min="0.5" max="5" step="0.5" value="1" style="width:100%">
    </label>

    <div id="selBox" style="display:none; margin-top:8px; border-top:1px solid #8884; padding-top:6px">
      <div>Вибраний заряд: <b id="selName"></b></div>
      <label>Величина: <span id="selMagVal"></span>
        <input type="range" id="selMag" min="0.5" max="5" step="0.5" value="1" style="width:100%">
      </label>
      <div style="margin-top:4px">
        <button id="delSel">Видалити</button>
        <button id="deselect">Зняти вибір</button>
      </div>
    </div>

    <label><input type="checkbox" id="showLines" checked> силові лінії</label>
    <label><input type="checkbox" id="showEq" checked> еквіпотенціалі</label>

    <label>Крок еквіпотенціалей: <span id="dvVal">1.00</span>
      <input type="range" id="dv" min="0.2" max="3" step="0.05" value="1" style="width:100%">
    </label>

    <div style="margin-top:6px">
      <button id="reset">Диполь</button>
      <button id="clear">Очистити</button>
    </div>
    <div id="info"></div>
  </div>

  <div id="hint">
    Клік на порожньому місці — поставити заряд. Перетягування — пересунути заряд.
    Клік по заряду — вибрати його й змінити величину повзунком на панелі (або колесом миші). Подвійний клік — видалити.
  </div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

const COL = {
  pos: '#d62728',
  neg: '#1f5fbf',
  line: dark ? '#cfd3da' : '#333',
  eq:   dark ? '#4fd17a' : '#1b8a3c'
};

const R = 12;        // радіус заряду, px
const SOFT = 6;      // пом'якшення на малих відстанях, px
const STEP = 1.5;    // крок інтегрування силових ліній, px
const G = 5;         // крок сітки для еквіпотенціалей, px
const MAX_CHARGES = 12;

const dvSlider = document.getElementById('dv');
const dvVal = document.getElementById('dvVal');
const showLines = document.getElementById('showLines');
const showEq = document.getElementById('showEq');
const info = document.getElementById('info');

let W = 0, H = 0, dirty = true;
let charges = [];          // {x, y, q}
let selSign = 1;
let drag = null;
let downCharge = null;
let selected = null;

/* ---------- фізика ---------- */

// Повертає [Ex, Ey, V] у точці (x, y); k = 1, одиниці умовні
function field(x, y) {
  let ex = 0, ey = 0, v = 0;
  for (const c of charges) {
    const dx = x - c.x, dy = y - c.y;
    const r2 = dx * dx + dy * dy + SOFT * SOFT;
    const r = Math.sqrt(r2);
    v += c.q / r;
    const f = c.q / (r2 * r);
    ex += f * dx;
    ey += f * dy;
  }
  return [ex, ey, v];
}

// Інтегрування силової лінії: s = +1 за полем, s = -1 проти поля
function trace(x, y, s) {
  const pts = [[x, y]];
  for (let i = 0; i < 4000; i++) {
    const [ex, ey] = field(x, y);
    const m = Math.hypot(ex, ey);
    if (m === 0) break;
    x += s * STEP * ex / m;
    y += s * STEP * ey / m;
    pts.push([x, y]);
    for (const c of charges) {
      if (Math.hypot(x - c.x, y - c.y) < R) return { pts, hit: true };
    }
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) break;
  }
  return { pts, hit: false };
}

/* ---------- малювання ---------- */

function drawLines() {
  ctx.strokeStyle = COL.line;
  ctx.fillStyle = COL.line;
  ctx.lineWidth = 1.3;
  ctx.setLineDash([]);

  for (const c of charges) {
    if (c.q === 0) continue;
    const s = c.q > 0 ? 1 : -1;
    const n = Math.round(8 + 4 * Math.abs(c.q));
    for (let k = 0; k < n; k++) {
      const th = 2 * Math.PI * (k + 0.5) / n;
      const sx = c.x + (R + 2) * Math.cos(th);
      const sy = c.y + (R + 2) * Math.sin(th);
      const res = trace(sx, sy, s);
      // лінії від від'ємних зарядів малюємо лише ті, що йдуть у нескінченність,
      // щоб лінії між +q і −q не намалювалися двічі
      if (s < 0 && res.hit) continue;
      strokeLine(res.pts);
    }
  }
}

function strokeLine(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();

  // стрілка напрямку E у середині лінії
  const m = Math.floor(pts.length / 2);
  if (m < 1 || m >= pts.length - 1) return;
  const [px, py] = pts[m];
  const [ex, ey] = field(px, py);
  const len = Math.hypot(ex, ey);
  if (len === 0) return;
  const ux = ex / len, uy = ey / len;
  const tipX = px + 5 * ux, tipY = py + 5 * uy;
  const bx = px - 3 * ux, by = py - 3 * uy;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(bx - 3 * uy, by + 3 * ux);
  ctx.lineTo(bx + 3 * uy, by - 3 * ux);
  ctx.closePath();
  ctx.fill();
}

// Еквіпотенціалі: маршинг-сквер по сітці потенціалу
const SEG = [
  [], [['L','B']], [['B','R']], [['L','R']],
  [['T','R']], [['T','L'],['B','R']], [['T','B']], [['T','L']],
  [['T','L']], [['T','B']], [['T','R'],['L','B']], [['T','R']],
  [['L','R']], [['B','R']], [['L','B']], []
];

function lerpT(a, b, L) { return b === a ? 0.5 : (L - a) / (b - a); }

function edgePt(e, x, y, va, vb, vc, vd, L) {
  switch (e) {
    case 'T': return [x + G * lerpT(va, vb, L), y];
    case 'R': return [x + G, y + G * lerpT(vb, vc, L)];
    case 'B': return [x + G * lerpT(vd, vc, L), y + G];
    default:  return [x, y + G * lerpT(va, vd, L)];   // 'L'
  }
}

function drawEquipotentials() {
  const nx = Math.ceil(W / G) + 1, ny = Math.ceil(H / G) + 1;
  const V = new Float32Array(nx * ny);
  let vmin = Infinity, vmax = -Infinity;
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const v = field(i * G, j * G)[2];
      V[j * nx + i] = v;
      if (v < vmin) vmin = v;
      if (v > vmax) vmax = v;
    }
  }

  const base = 0.02 * Number(dvSlider.value);
  const step = Math.max(base, (vmax - vmin) / 60);   // не більше ~60 рівнів
  const n0 = Math.ceil(vmin / step), n1 = Math.floor(vmax / step);

  ctx.strokeStyle = COL.eq;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();

  for (let n = n0; n <= n1; n++) {
    const L = n * step;
    for (let j = 0; j < ny - 1; j++) {
      for (let i = 0; i < nx - 1; i++) {
        const va = V[j * nx + i], vb = V[j * nx + i + 1];
        const vc = V[(j + 1) * nx + i + 1], vd = V[(j + 1) * nx + i];
        const cs = ((va > L) ? 8 : 0) | ((vb > L) ? 4 : 0) |
                   ((vc > L) ? 2 : 0) | ((vd > L) ? 1 : 0);
        if (cs === 0 || cs === 15) continue;
        const x = i * G, y = j * G;
        for (const [e1, e2] of SEG[cs]) {
          const p = edgePt(e1, x, y, va, vb, vc, vd, L);
          const q = edgePt(e2, x, y, va, vb, vc, vd, L);
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(q[0], q[1]);
        }
      }
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawCharges() {
  for (const c of charges) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, R, 0, 2 * Math.PI);
    ctx.fillStyle = c.q > 0 ? COL.pos : COL.neg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = dark ? '#111' : '#fff';
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.q > 0 ? '+' : '−', c.x, c.y + 0.5);

    if (c === selected) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, R + 5, 0, 2 * Math.PI);
      ctx.strokeStyle = dark ? '#fff' : '#000';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (Math.abs(c.q) !== 1) {
      ctx.fillStyle = dark ? '#eee' : '#222';
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText(String(Math.abs(c.q)), c.x, c.y - R - 9);
    }
  }
}

function updateInfo() {
  const sum = charges.reduce((s, c) => s + c.q, 0);
  info.textContent = `Зарядів: ${charges.length}, Σq = ${sum.toFixed(1)}`;
}

function render() {
  if (dirty) {
    dirty = false;
    ctx.clearRect(0, 0, W, H);
    if (showEq.checked) drawEquipotentials();
    if (showLines.checked) drawLines();
    drawCharges();
    updateInfo();
  }
  requestAnimationFrame(render);
}

/* ---------- взаємодія ---------- */

function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function hitCharge(p) {
  for (let i = charges.length - 1; i >= 0; i--) {
    const c = charges[i];
    if (Math.hypot(p.x - c.x, p.y - c.y) < R + 4) return c;
  }
  return null;
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  const c = hitCharge(p);
  downCharge = c;
  if (c) drag = c;
  cv.setPointerCapture(e.pointerId);
  dirty = true;
});

cv.addEventListener('pointermove', e => {
  const p = pos(e);
  if (drag) {
    drag.x = clamp(p.x, 0, W);
    drag.y = clamp(p.y, 0, H);
    dirty = true;
  }
  cv.style.cursor = drag ? 'grabbing' : (hitCharge(p) ? 'grab' : 'crosshair');
});

cv.addEventListener('pointerup', () => { drag = null; dirty = true; });

cv.addEventListener('click', e => {
  if (e.detail > 1) return;             // подвійний клік не додає заряди
  if (downCharge) {
    selected = downCharge;
    downCharge = null;
    syncPanel();
    dirty = true;
    return;
  }
  const p = pos(e);
  if (charges.length < MAX_CHARGES) charges.push({ x: p.x, y: p.y, q: selSign * newMag() });
  dirty = true;
});

cv.addEventListener('dblclick', e => {
  const c = hitCharge(pos(e));
  if (c) {
    charges = charges.filter(x => x !== c);
    if (drag === c) drag = null;
    if (selected === c) selected = null;
    syncPanel();
    dirty = true;
  }
});

cv.addEventListener('wheel', e => {
  const c = hitCharge(pos(e));
  if (!c) return;
  e.preventDefault();
  const mag = Math.abs(c.q) + (e.deltaY < 0 ? 0.5 : -0.5);
  c.q = Math.sign(c.q) * clamp(mag, 0.5, 5);
  selected = c;
  syncPanel();
  dirty = true;
}, { passive: false });

/* ---------- панель ---------- */

const btnPos = document.getElementById('addPos');
const btnNeg = document.getElementById('addNeg');
btnPos.onclick = () => { selSign = 1;  btnPos.classList.add('sel');    btnNeg.classList.remove('sel'); };
btnNeg.onclick = () => { selSign = -1; btnNeg.classList.add('sel');    btnPos.classList.remove('sel'); };

document.getElementById('reset').onclick = () => {
  charges = [
    { x: W / 2 - 120, y: H / 2, q: 1 },
    { x: W / 2 + 120, y: H / 2, q: -1 }
  ];
  selected = null;
  syncPanel();
  dirty = true;
};
document.getElementById('clear').onclick = () => {
  charges = [];
  selected = null;
  syncPanel();
  dirty = true;
};

dvSlider.oninput = () => { dvVal.textContent = Number(dvSlider.value).toFixed(2); dirty = true; };
const newMagSlider = document.getElementById('newMag');
const magVal = document.getElementById('magVal');
const selMag = document.getElementById('selMag');
const selMagVal = document.getElementById('selMagVal');
const selBox = document.getElementById('selBox');
const selName = document.getElementById('selName');

function newMag() { return Number(newMagSlider.value); }

function syncPanel() {
  if (selected && !charges.includes(selected)) selected = null;
  if (selected) {
    selBox.style.display = 'block';
    selName.textContent = selected.q > 0 ? '+' : '−';
    selMag.value = Math.abs(selected.q);
    selMagVal.textContent = Math.abs(selected.q).toFixed(1);
  } else {
    selBox.style.display = 'none';
  }
}

newMagSlider.oninput = () => { magVal.textContent = newMag().toFixed(1); };

selMag.oninput = () => {
  if (!selected) return;
  selected.q = Math.sign(selected.q) * Number(selMag.value);
  selMagVal.textContent = Math.abs(selected.q).toFixed(1);
  dirty = true;
};

document.getElementById('delSel').onclick = () => {
  if (!selected) return;
  charges = charges.filter(x => x !== selected);
  selected = null;
  syncPanel();
  dirty = true;
};
document.getElementById('deselect').onclick = () => {
  selected = null;
  syncPanel();
  dirty = true;
};

showLines.onchange = () => { dirty = true; };
showEq.onchange = () => { dirty = true; };

/* ---------- старт ---------- */

function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth;
  H = cv.clientHeight;
  cv.width = Math.round(W * d);
  cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  dirty = true;
}
window.addEventListener('resize', resize);
resize();
document.getElementById('reset').onclick();
requestAnimationFrame(render);
</script>
</body>
</html>
